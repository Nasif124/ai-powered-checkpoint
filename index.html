<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasif Bamidele | Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #ffe4e6, #fecdd3, #f9a8d4);
      color: #374151;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      color: #be123c;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #4b5563;
      line-height: 1.6;
    }

    button {
      background-color: #e11d48;
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #be123c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Nasif Bamidele</h1>
    <p>Creative Developer & Designer passionate about crafting delightful digital experiences.</p>
    <button>View My Projects</button>
  </section>
</body>
</html>
